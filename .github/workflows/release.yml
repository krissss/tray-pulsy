name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package, for example v1.3.1'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'TrayPulsy.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build
        run: make app

      - name: Package ZIP
        run: ditto -c -k --sequesterRsrc --keepParent TrayPulsy.app TrayPulsy-${{ env.RELEASE_TAG }}.zip

      - name: Sign update with Sparkle
        id: sparkle_sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SIGN_UPDATE=$(make print-sparkle-sign-update)
          # Sign the zip — pipe private key via stdin, no Keychain needed
          SIGNATURE=$(echo -n "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" TrayPulsy-${{ env.RELEASE_TAG }}.zip --ed-key-file - 2>&1)
          echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"

          # Get file size
          SIZE=$(stat -f%z TrayPulsy-${{ env.RELEASE_TAG }}.zip)
          echo "length=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Update appcast.xml
        run: |
          VER="${{ env.RELEASE_TAG }}"
          VERSION_NUM="${VER#v}"
          SIGNATURE="${{ steps.sparkle_sign.outputs.signature }}"
          LENGTH="${{ steps.sparkle_sign.outputs.length }}"
          DATE=$(date -R)

          # Extract sparkle:edSignature from sign_update output (format: "sparkle:edSignature=<sig> length=<len>")
          ED_SIG=$(echo "$SIGNATURE" | sed -n 's/.*sparkle:edSignature=\([^ ]*\).*/\1/p')

          # Build new appcast item — Python handles XML safely
          python3 -c "
          import html, textwrap
          ver = '$VER'
          ver_num = '$VERSION_NUM'
          ed_sig = '$ED_SIG'
          length = '$LENGTH'
          date_str = '$DATE'

          # The custom update UI reads full version details from docs/CHANGELOG.md.
          notes_html = html.escape('See the full changelog for details.')

          item = textwrap.dedent(f'''\
          <item>
              <title>TrayPulsy {ver_num}</title>
              <sparkle:version>{ver_num}</sparkle:version>
              <sparkle:shortVersionString>{ver_num}</sparkle:shortVersionString>
              <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>
              <sparkle:fullReleaseNotesLink>https://krissss.github.io/tray-pulsy/CHANGELOG.md</sparkle:fullReleaseNotesLink>
              <pubDate>{date_str}</pubDate>
              <description><![CDATA[{notes_html}]]></description>
              <enclosure
                  url=\"https://github.com/krissss/tray-pulsy/releases/download/{ver}/TrayPulsy-{ver}.zip\"
                  sparkle:edSignature=\"{ed_sig}\"
                  length=\"{length}\"
                  type=\"application/octet-stream\"
              />
          </item>''').rstrip()

          content = '\n'.join([
              '<?xml version=\"1.0\" encoding=\"utf-8\"?>',
              '<rss version=\"2.0\" xmlns:sparkle=\"http://www.andymatuschak.org/xml-namespaces/sparkle\" xmlns:dc=\"http://purl.org/dc/elements/1.1/\">',
              '    <channel>',
              '        <title>TrayPulsy Update Feed</title>',
              '        <link>https://krissss.github.io/tray-pulsy/appcast.xml</link>',
              '        <description>TrayPulsy release updates</description>',
              '        <language>en</language>',
              textwrap.indent(item, '        '),
              '    </channel>',
              '</rss>',
              '',
          ])
          with open('docs/appcast.xml', 'w') as f:
              f.write(content)
          "

      - name: Commit updated appcast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Save modified appcast before switching branches
          cp docs/appcast.xml /tmp/appcast_new.xml
          # Switch from detached HEAD (at tag) to main branch
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/appcast_new.xml docs/appcast.xml
          git add docs/appcast.xml
          git diff --cached --quiet || git commit -m "chore: update appcast.xml for ${RELEASE_TAG}"
          git push origin main

      - name: Package DMG
        run: |
          DMG=TrayPulsy-${{ env.RELEASE_TAG }}.dmg
          DMG_STAGING=TrayPulsy-dmg-staging
          mkdir -p "$DMG_STAGING"
          ditto TrayPulsy.app "$DMG_STAGING/TrayPulsy.app"
          ln -s /Applications "$DMG_STAGING/Applications"
          hdiutil create -volname "TrayPulsy" -srcfolder "$DMG_STAGING" -ov -format UDZO "$DMG"
          rm -rf "$DMG_STAGING"

      - name: Generate checksums
        id: checksum
        run: |
          ZIP_SHA=$(shasum -a 256 TrayPulsy-${{ env.RELEASE_TAG }}.zip | cut -d ' ' -f 1)
          DMG_SHA=$(shasum -a 256 TrayPulsy-${{ env.RELEASE_TAG }}.dmg | cut -d ' ' -f 1)
          echo "zip_sha=$ZIP_SHA" >> "$GITHUB_OUTPUT"
          echo "dmg_sha=$DMG_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            TrayPulsy-${{ env.RELEASE_TAG }}.zip
            TrayPulsy-${{ env.RELEASE_TAG }}.dmg

      - name: Update Homebrew Tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ env.RELEASE_TAG }}
          SHA256: ${{ steps.checksum.outputs.dmg_sha }}
        run: |
          VER="${VERSION#v}"
          cat > tray-pulsy.rb <<'CASK'
          cask "tray-pulsy" do
            version "_VER_"
            sha256 "_SHA_"

            url "https://github.com/krissss/tray-pulsy/releases/download/_TAG_/TrayPulsy-_TAG_.dmg"
            name "TrayPulsy"
            desc "Lightweight macOS menu bar app with animated system monitor"
            homepage "https://github.com/krissss/tray-pulsy"

            depends_on macos: ">= :tahoe"

            app "TrayPulsy.app"

            zap delete: [
              "~/Library/Preferences/com.traypulsy.app.plist",
            ]
          end
          CASK
          sed -i '' "s/_VER_/${VER}/g; s/_SHA_/${SHA256}/g; s/_TAG_/${VERSION}/g" tray-pulsy.rb
          ENCODED=$(base64 < tray-pulsy.rb | tr -d '\n')
          FILE_SHA=$(curl -sf -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/krissss/homebrew-tap/contents/Casks/tray-pulsy.rb" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || echo "")
          BODY="{\"message\":\"Update tray-pulsy to ${VER}\",\"content\":\"${ENCODED}\"}"
          if [ -n "$FILE_SHA" ]; then
            BODY="{\"message\":\"Update tray-pulsy to ${VER}\",\"content\":\"${ENCODED}\",\"sha\":\"${FILE_SHA}\"}"
          fi
          curl -sf -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/krissss/homebrew-tap/contents/Casks/tray-pulsy.rb" \
            -d "$BODY" || echo "Tap update skipped"
